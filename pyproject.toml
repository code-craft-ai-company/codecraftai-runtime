[tool.poetry]
name = "automojo-runtime"
description = "Automation Mojo - Runtime"
version = "0.0.1"
authors = []
readme = "README.rst"
license = "LICENSE.txt"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX"
]
keywords = [
    "python"
]
packages = [{include="automojo", from="source/packages"}]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
debugpy = "^1.8.12"
automojo-errors = { git = "https://github.com/automationmojo/automojo-errors.git", branch = "main" }
automojo-presence = { git = "https://github.com/automationmojo/automojo-presence.git", branch = "main" }
automojo-xmodules = { git = "https://github.com/automationmojo/automojo-xmodules.git", branch = "main" }
automojo-waiting = { git = "https://github.com/automationmojo/automojo-waiting.git", branch = "main" }
automojo-configuration = { git = "https://github.com/automationmojo/automojo-configuration.git", branch = "main" }


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
